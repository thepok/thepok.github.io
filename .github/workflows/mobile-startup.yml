name: Mobile startup regression
on:
  push:
    branches: [chatgpt-mobile-startup-fix]
    paths:
      - tools/mobile-startup/**
      - .github/workflows/mobile-startup.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract current KINETIC 0.2.1 full-game source
        run: |
          mkdir -p game
          unzip -q games/loadbearing-own-fast/source.zip -d game
          python3 tools/mobile-startup/apply.py game
      - name: Install exact locked dependencies and build
        working-directory: game
        run: |
          npm ci
          npm run build
      - name: Startup quality regressions
        working-directory: game
        run: |
          mkdir -p artifacts/mobile-startup
          node --import ./tests/own-env.mjs tests/startup-settling.mjs | tee artifacts/mobile-startup/startup-settling.log
          node --import ./tests/own-env.mjs tests/startup-generated.mjs | tee artifacts/mobile-startup/startup-generated.log
      - name: Android-style slow-device start test
        working-directory: game
        run: |
          cat > tests/mobile-start-real.mjs <<'EOF'
          import {chromium} from '@playwright/test';
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          const context=await browser.newContext({viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 Chrome/152.0 Mobile Safari/537.36'});
          const page=await context.newPage(),errors=[],progress=[];
          page.on('pageerror',e=>errors.push(e.message));
          const cdp=await context.newCDPSession(page);await cdp.send('Emulation.setCPUThrottlingRate',{rate:4});
          await page.addInitScript(()=>{Object.defineProperty(navigator,'hardwareConcurrency',{get:()=>4});localStorage.setItem('loadbearing-own-fast.demo-seen','1');localStorage.setItem('loadbearing-own-fast.last-mode',JSON.stringify({challengeId:'sandbox-demolition-yard'}));});
          try{
            await page.goto('http://127.0.0.1:5174/');await page.waitForFunction(()=>window.__loadBearing?.ready,{},{timeout:90000});
            await page.evaluate(()=>{document.getElementById('workshop-mode').click();document.getElementById('sandbox-mode').click();document.getElementById('clear').click();document.getElementById('procedural-style').value='art-deco';document.getElementById('procedural-count-number').value='1000';const old=Date.now;Date.now=()=>0x51a7;try{document.getElementById('generate-building').click();}finally{Date.now=old;}document.getElementById('run').click();});
            const start=Date.now();
            for(let i=0;i<90;i++){const row=await page.evaluate(()=>({status:document.getElementById('status').textContent,timer:document.getElementById('timer').textContent,elapsed:window.__loadBearing.simulation?.elapsed??null,startup:window.__loadBearing.simulation?.startup??null}));progress.push({wallMs:Date.now()-start,...row});if((row.elapsed??0)>.5)break;await page.waitForTimeout(500);}
            const final=progress.at(-1);assert.ok(progress.some(p=>/%/.test(p.timer)&&/EINREGELN/.test(p.status)),'Mobile startup must visibly report preload progress instead of a frozen 0.0 s');
            assert.ok((final.elapsed??0)>.5,'Simulation clock must start on a 4x-throttled phone profile within 45 seconds');
            assert.ok(final.startup?.quiet,'Mobile preload must still reach the original quiet-state criterion');
            assert.equal(await page.evaluate(()=>__loadBearing.simulation.broken),0,'No startup damage');
            assert.deepEqual(errors,[]);
            await page.screenshot({path:'artifacts/mobile-startup/mobile-running.png',fullPage:true});
            await writeFile('artifacts/mobile-startup/mobile-progress.json',JSON.stringify({progress,errors},null,2));
            console.log('MOBILE_START_PASS '+JSON.stringify({wallMs:final.wallMs,startup:final.startup,elapsed:final.elapsed}));
          }finally{await browser.close();}
          EOF
          npm run preview -- --port 5174 > /tmp/mobile-preview.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:5174/ >/dev/null; then break; fi; sleep 1; done
          node tests/mobile-start-real.mjs
      - name: Preserve evidence and tested dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-startup-fix
          path: |
            game/dist/
            game/src/
            game/tests/
            game/public/
            game/package*.json
            game/tsconfig.json
            game/vite.config.ts
            game/index.html
            game/artifacts/mobile-startup/
          retention-days: 14
