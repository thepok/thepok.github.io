name: Unpack loadbearing source

on:
  push:
    branches:
      - chatgpt-unpack-loadbearing
    paths:
      - .github/workflows/unpack-loadbearing.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          rm -rf games/loadbearing/source-unpacked
          mkdir -p games/loadbearing/source-unpacked
          unzip -q games/loadbearing/source.zip -d games/loadbearing/source-unpacked
      - name: Commit unpacked source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/loadbearing/source-unpacked
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: unpack loadbearing source"
            git push
          fi
