name: Publish verified KINETIC speed and benchmark preview
on:
  push:
    branches: [chatgpt-kinetic-speed-v2]
    paths:
      - tools/kinetic-speed-release/prepare.py
      - tools/kinetic-speed-release/README.md
      - .github/workflows/kinetic-speed-publish.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require final pinned complete-game browser gate and native results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 35425224196 --repo thepok/thepok.github.io --exit-status
          test "$(gh api repos/thepok/thepok.github.io/actions/runs/35425224196 --jq '.conclusion')" = success
          test "$(gh api repos/thepok/thepok.github.io/actions/runs/35425224196 --jq '.head_sha')" = da87afd56d55478f287e24617a762d0be80d5028
      - uses: actions/download-artifact@v4
        with:
          name: kinetic-speed-final-game
          run-id: 35425224196
          github-token: ${{ github.token }}
          path: validated
      - name: Audit and package exact tested native binaries and GUI without rebuilding
        run: |
          if [ -d validated/game/src ]; then mv validated unpacked; mv unpacked/game validated; fi
          if [ -d validated/validated/src ]; then mv validated unpacked; mv unpacked/validated validated; fi
          cd validated
          npm ci
          node tests/own-audit.mjs
          node tests/speed-audit.mjs
          node tests/benchmark-contract.mjs
          node tests/fast-floor-regression.mjs
          cd ..
          python3 tools/kinetic-speed-release/prepare.py
      - name: Publish only new preview directory; leave approved KINETIC unchanged
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git switch -C main origin/main
          mkdir -p games/loadbearing-own-fast
          cp -a /tmp/loadbearing-own-fast/. games/loadbearing-own-fast/
          git add games/loadbearing-own-fast
          if git diff --cached --quiet; then echo 'Already published'; else
            test -z "$(git diff --cached --name-only | grep -v '^games/loadbearing-own-fast/' || true)"
            git commit -m 'preview: publish accelerated own KINETIC engine with reproducible A-B benchmark'
            git push origin main
          fi
      - name: Require exact current index and metadata on public HTTPS
        run: |
          ready=0
          for i in $(seq 1 60); do
            ready=1
            for file in index.html BUILD.json; do
              if ! curl -fsS --max-time 15 "https://thepok.github.io/games/loadbearing-own-fast/$file?verify=$GITHUB_SHA" -o /tmp/live-speed-file || ! cmp -s /tmp/live-speed-file "/tmp/loadbearing-own-fast/$file"; then ready=0; break; fi
            done
            if [ "$ready" = 1 ]; then break; fi
            sleep 5
          done
          test "$ready" = 1
      - name: Public benchmark controls, export, cancellation and visible A-B crashes
        working-directory: validated
        run: |
          mv artifacts/speed-browser artifacts/speed-browser-local
          TEST_URL=https://thepok.github.io/games/loadbearing-own-fast/ node tests/speed-browser.mjs
      - name: Preserve public-site evidence and downloadable tested source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-speed-public-verification
          path: |
            validated/artifacts/speed-browser/
            /tmp/loadbearing-own-fast/BUILD.json
            /tmp/loadbearing-own-fast/source.zip
          if-no-files-found: warn
          retention-days: 30
