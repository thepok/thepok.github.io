name: Loadbearing worker browser check

on:
  push:
    branches:
      - chatgpt-unpack-loadbearing
    paths:
      - .github/workflows/loadbearing-worker-browser.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/loadbearing/source-unpacked
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/loadbearing/source-unpacked/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run direct worker backpressure and buffer recycling check
        run: |
          mkdir -p artifacts
          cat > artifacts/worker-direct-ci.mjs <<'EOF'
          import {chromium} from '@playwright/test';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:800}});
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          try{
            await page.goto('http://127.0.0.1:5174');
            const init=await page.evaluate(async()=>{
              const [{Simulation},{generateDemolitionBuilding}]=await Promise.all([
                import('/src/simulation-client.ts'),
                import('/src/procedural-buildings.ts'),
              ]);
              const pieces=generateDemolitionBuilding(120,0x51a7,'brutalist').pieces;
              const sim=new Simulation({},pieces,'sandbox',1,{sandbox:true,fragmentLimit:156});
              globalThis.__directSim=sim;
              await sim.ready;
              sim.step();
              return {mode:sim.mode,threads:sim.threads,pieces:sim.pieces.length,crossOriginIsolated:globalThis.crossOriginIsolated};
            });
            assert.equal(init.pieces,120);
            await page.evaluate(()=>{
              const s=globalThis.__directSim;
              globalThis.__acks=[];globalThis.__snapshots=0;
              const post=s.worker.postMessage.bind(s.worker);
              s.worker.postMessage=(message,transfer)=>{
                if(message?.type==='snapshot-consumed')globalThis.__acks.push({
                  seq:message.seq,
                  poseBytes:message.poseBuffer?.byteLength??0,
                  stressBytes:message.stressBuffer?.byteLength??0,
                  transfers:Array.isArray(transfer)?transfer.length:0,
                });
                return post(message,transfer);
              };
              globalThis.__snapshotListener=e=>{if(e.data?.type==='snapshot')globalThis.__snapshots++};
              s.worker.addEventListener('message',globalThis.__snapshotListener);
            });
            await page.waitForTimeout(700);
            const stalled=await page.evaluate(()=>globalThis.__snapshots);
            assert.ok(stalled<=1,'worker emitted more than one unconsumed snapshot: '+stalled);
            await page.evaluate(()=>globalThis.__directSim.step());
            const before=await page.evaluate(()=>globalThis.__directSim.elapsed);
            await page.evaluate(()=>globalThis.__pump=setInterval(()=>globalThis.__directSim.step(),16));
            await page.waitForTimeout(700);
            const result=await page.evaluate(()=>{
              clearInterval(globalThis.__pump);
              const s=globalThis.__directSim,after=s.elapsed,acks=globalThis.__acks;
              s.worker.removeEventListener('message',globalThis.__snapshotListener);
              s.dispose();
              return {after,acks,snapshots:globalThis.__snapshots};
            });
            assert.ok(result.after>before,'simulation did not resume after snapshot consumption');
            assert.ok(result.acks.some(a=>a.transfers===2&&a.poseBytes>0&&a.stressBytes>0),'snapshot buffers were not transferred back to worker');
            assert.deepEqual(errors,[]);
            console.log('PASS direct worker backpressure + buffer recycling',JSON.stringify({init,stalled,acks:result.acks.length,snapshots:result.snapshots}));
          }finally{await browser.close()}
          EOF
          npm run dev -- --port 5174 > /tmp/loadbearing-vite.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5174 >/dev/null; then break; fi
            sleep 1
          done
          node artifacts/worker-direct-ci.mjs
