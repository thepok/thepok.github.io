name: Loadbearing solver tuning

on:
  push:
    branches:
      - chatgpt-unpack-loadbearing
    paths:
      - .github/workflows/loadbearing-solver-tune.yml

permissions:
  contents: read

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/loadbearing/source-unpacked/package-lock.json
      - name: Install dependencies
        working-directory: games/loadbearing/source-unpacked
        run: npm ci
      - name: Benchmark solver variants
        working-directory: games/loadbearing/source-unpacked
        run: |
          cat > solver-tune.mjs <<'EOF'
          import {performance} from 'node:perf_hooks';
          import {build} from 'esbuild';
          import {pathToFileURL} from 'node:url';
          import {resolve} from 'node:path';
          await build({stdin:{contents:"export {Simulation,loadPhysics} from './src/physics.ts';export {generateDemolitionBuilding} from './src/procedural-buildings.ts';",resolveDir:process.cwd()},bundle:true,platform:'node',format:'esm',external:['jolt-physics'],outfile:'artifacts/solver-tune.mjs'});
          const {Simulation,loadPhysics,generateDemolitionBuilding}=await import(pathToFileURL(resolve('artifacts/solver-tune.mjs')).href+'?'+Date.now());
          const J=await loadPhysics(),pieces=generateDemolitionBuilding(1000,0x51a7,'brutalist').pieces;
          const pct=(a,p)=>[...a].sort((x,y)=>x-y)[Math.floor((a.length-1)*p)];
          for(const [velocity,position] of [[12,3],[8,2],[6,2],[4,1]]){
            const sim=new Simulation(J,structuredClone(pieces),'sandbox',1,{sandbox:true,fragmentLimit:156},0);
            const settings=sim.system.GetPhysicsSettings();settings.mNumVelocitySteps=velocity;settings.mNumPositionSteps=position;sim.system.SetPhysicsSettings(settings);
            for(let i=0;i<120;i++)sim.step(1/60);
            sim.setSandboxHazard('wind',true);
            for(let i=0;i<60;i++)sim.step(1/60);
            const samples=[];for(let i=0;i<120;i++){const t=performance.now();sim.step(1/60);samples.push(performance.now()-t)}
            const status=sim.buildingStatus();
            const mean=samples.reduce((a,b)=>a+b,0)/samples.length;
            console.log('SOLVER '+JSON.stringify({velocity,position,meanMs:+mean.toFixed(3),medianMs:+pct(samples,.5).toFixed(3),p95Ms:+pct(samples,.95).toFixed(3),broken:sim.broken,fragments:sim.fragments,maxStress:+sim.maxStress.toFixed(4),peakStress:+sim.peakStress.toFixed(4),buildingPassed:status.passed,completedFloors:status.completedFloors,bodies:sim.bodyList.length,joints:sim.joints.length,rebars:sim.rebars.length}));
            sim.dispose();
          }
          EOF
          node solver-tune.mjs
